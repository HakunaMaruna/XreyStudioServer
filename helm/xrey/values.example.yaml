# Production-oriented values. Create the Secret first, then:
#   helm upgrade --install xss ./helm/xrey -n xss --create-namespace \
#     -f helm/xrey/values.example.yaml
#
# kubectl create secret generic xss-secrets -n xss \
#   --from-literal=POSTGRES_PASSWORD='...' \
#   --from-literal=JWT_SECRET='...' \
#   --from-literal=JWT_REFRESH_SECRET='...' \
#   --from-literal=ADMIN_EMAIL='admin@example.com' \
#   --from-literal=ADMIN_PASSWORD='...' \
#   --from-literal=AGENT_TOKEN='...' \
#   --from-literal=ALERT_WEBHOOK_TOKEN='...'

existingSecret: xss-secrets

config:
  domain: panel.example.com
  panelUrl: https://panel.example.com
  corsOrigin: https://panel.example.com

image:
  backend:
    repository: ghcr.io/hakunamaruna/xss-backend
    tag: "2.26.1"
  frontend:
    repository: ghcr.io/hakunamaruna/xss-frontend
    tag: "2.26.1"
  agent:
    repository: ghcr.io/hakunamaruna/xss-agent
    tag: "2.26.1"

backend:
  replicas: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  extraVolumes:
    - name: backups
      persistentVolumeClaim:
        claimName: xss-backups
  extraVolumeMounts:
    - name: backups
      mountPath: /app/backups

postgres:
  storage:
    size: 50Gi
    storageClass: gp3

redis:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3

ingress:
  host: panel.example.com
  clusterIssuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: xss-tls

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
