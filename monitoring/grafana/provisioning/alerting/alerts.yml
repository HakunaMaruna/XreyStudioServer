apiVersion: 1

contactPoints:
  - orgId: 1
    name: xss-webhook
    receivers:
      - uid: xss-webhook-receiver
        type: webhook
        settings:
          url: http://backend:3000/api/notifications/alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_WEBHOOK_TOKEN

policies:
  - orgId: 1
    receiver: xss-webhook
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

groups:
  - orgId: 1
    name: xss-availability
    folder: XSS
    interval: 1m
    rules:
      - uid: xss-backend-down
        title: XSS backend is down
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: XSS backend target is down
          description: Prometheus cannot scrape the XSS backend for more than one minute.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="xss-backend"} == bool 0
              instant: true
              range: false
              rawQuery: true
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce

      - uid: xss-node-offline
        title: XSS node offline
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: One or more XSS nodes are offline
          description: The number of online nodes is lower than the number of registered nodes.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (xss_nodes_total - xss_nodes_online) > bool 0
              instant: true
              range: false
              rawQuery: true
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce

  - orgId: 1
    name: xss-capacity
    folder: XSS
    interval: 1m
    rules:
      - uid: xss-backend-memory
        title: XSS backend memory high
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: XSS backend RSS memory above 512 MiB
          description: Consider scaling the backend or checking for a memory leak.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: xss_process_memory_bytes{type="rss"} > 536870912
              instant: true
              range: false
              rawQuery: true
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce

      - uid: xss-node-cpu-high
        title: XSS node CPU high
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Node CPU usage above 85%
          description: A node reports sustained high CPU usage.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: xss_node_cpu_percent > 85
              instant: true
              range: false
              rawQuery: true
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
