apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: xss
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: xss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: xss-agent:2.16.0
          ports:
            - containerPort: 9090
          env:
            - name: PANEL_URL
              value: "http://backend:3000"
            - name: NODE_ID
              value: "node-1"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xss-secrets
                  key: AGENT_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
