version: "3.9"

# Node-only stack used by install.sh --mode node and by the wizard's SSH provisioning.
# It intentionally has no depends_on: backend — a node must not build or start the panel.
services:
  agent:
    build: ./agent
    # Only the agent's whitelisted env file is mounted (see install.sh write_agent_env).
    env_file: .agent.env
    environment:
      PANEL_URL: ${PANEL_URL:-http://localhost:3000}
      XRAY_MANAGED: "true"
      DECOY_PORT: ${DECOY_PORT:-8443}
      DECOY_HTTP_PORT: "80"
      DECOY_TLS_DIR: ${DECOY_TLS_DIR:-/etc/xss-agent/decoy}
      ACME_WEBROOT: ${ACME_WEBROOT:-/var/www/certbot}
      WIZARD_DECOY_PORT: ${DECOY_PORT:-8443}
    ports:
      # Default wizard inbound (VLESS Reality) listens on 443 inside the agent container.
      - "443:443/tcp"
      - "4436:4436/tcp"
      # Panel-to-agent API (certificate install, config push, health checks).
      - "9090:9090/tcp"
      - "80:80/tcp"
      - "2053:2053/tcp"
      - "2053:2053/udp"
      - "2054:2054/tcp"
    restart: unless-stopped
