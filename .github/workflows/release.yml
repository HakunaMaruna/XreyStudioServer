name: Release bundle

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if git rev-parse -q --verify "${TAG}^" >/dev/null 2>&1; then
            PREV=$(git describe --tags --abbrev=0 "${TAG}^")
          else
            PREV=""
          fi
          STAGE="${RUNNER_TEMP}/xss-bundle"
          mkdir -p "${STAGE}"
          git archive --format=tar "${TAG}" | tar -x -C "${STAGE}"
          {
            echo "# XreyStudioServer ${TAG}"
            echo
            if [ -n "${PREV}" ]; then
              echo "Changes since ${PREV}:"
              echo
              git log --no-merges --pretty=format:'- %h %s' "${PREV}..${TAG}"
            else
              echo "Initial tagged release."
              git log --pretty=format:'- %h %s' "${TAG}"
            fi
            echo
          } > "${STAGE}/CHANGELOG-${TAG}.md"
          tar -czf "${TAG}.bundle.tar.gz" -C "${STAGE}" .
          sha256sum "${TAG}.bundle.tar.gz" > "${TAG}.bundle.tar.gz.sha256"
          echo "ASSET=${TAG}.bundle.tar.gz" >> "${GITHUB_ENV}"
      - name: Sign release bundle with Ed25519
        id: sign
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_PRIVATE_KEY}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          KEY="${RUNNER_TEMP}/update_signing_key.pem"
          printf '%s' "${UPDATE_PRIVATE_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          openssl pkeyutl -sign -rawin -inkey "${KEY}" -in "${ASSET}" -out "${ASSET}.sig"
          openssl pkey -in "${KEY}" -pubout -out update_public.pem
          sha256sum "${ASSET}.sig" > "${ASSET}.sig.sha256"
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          rm -f "${KEY}"
      - name: Attach assets to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Attach signed update assets
        if: steps.sign.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}.sig
            ${{ env.ASSET }}.sig.sha256
            update_public.pem
          fail_on_unmatched_files: true
